<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva Board - Tablica Kanban</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Canva Board</h1>
            <div class="status-bar">
                <span id="network-status" class="status-indicator online">Online</span>
                <button id="sync-btn" class="btn btn-small" style="display: none;">Synchronizuj</button>
            </div>
        </header>

        <section class="add-task-container">
            <div class="card">
                <h2>Dodaj nowe zadanie</h2>
                <form id="add-task-form">
                    <div class="form-group">
                        <label for="task-title">Tytuł</label>
                        <input type="text" id="task-title" class="input-field" placeholder="Tytuł zadania..." required>
                    </div>
                    <div class="form-group">
                        <label for="task-desc">Opis</label>
                        <textarea id="task-desc" class="input-field" placeholder="Opis zadania..."></textarea>
                    </div>
                    <button type="submit" class="btn">Dodaj zadanie</button>
                </form>
            </div>
        </section>

        <main class="board">
            <div class="column" id="todo-column">
                <h3>Do zrobienia</h3>
                <div class="task-list" id="todo-list"></div>
            </div>
            <div class="column" id="in-progress-column">
                <h3>W trakcie</h3>
                <div class="task-list" id="in-progress-list"></div>
            </div>
            <div class="column" id="done-column">
                <h3>Zrobione</h3>
                <div class="task-list" id="done-list"></div>
            </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Registration failed', err));
            });
        }
    </script>
</body>
</html>
